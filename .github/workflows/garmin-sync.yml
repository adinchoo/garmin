name: Garmin Sync

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM Malaysia time
    - cron: "0 23 * * *"

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      USER_ID: ${{ secrets.USER_ID }}
      DAYS_BACK: "3"
      GARMIN_TOKEN_STORE: ./garmin_tokens
      GARMIN_DISABLE_FRESH_LOGIN: "1"
      GARMIN_TOKENS_TGZ_BASE64: ${{ secrets.GARMIN_TOKENS_TGZ_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Garmin tokens from secret
        run: |
          rm -rf garmin_tokens garmin_tokens.tar.gz
          if [ -z "$GARMIN_TOKENS_TGZ_BASE64" ]; then
            echo "GARMIN_TOKENS_TGZ_BASE64 secret is empty."
            exit 1
          fi
          printf '%s' "$GARMIN_TOKENS_TGZ_BASE64" | tr -d '\r\n ' | base64 -d > garmin_tokens.tar.gz
          tar -xzf garmin_tokens.tar.gz
          echo "Garmin token folder restored."
          ls -la garmin_tokens

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Garmin sync
        run: python sync_garmin.py