name: Activity Intelligence Sync
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Activities to enrich
        required: true
        default: "10"
  schedule:
    - cron: "20 23 * * *"
concurrency:
  group: activity-intelligence
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      USER_ID: ${{ secrets.USER_ID }}
      GARMIN_TOKEN_STORE: ./garmin_tokens
      GARMIN_DISABLE_FRESH_LOGIN: "1"
      GARMIN_TOKENS_TGZ_BASE64: ${{ secrets.GARMIN_TOKENS_TGZ_BASE64 }}
      STREAM_SYNC_LIMIT: ${{ github.event.inputs.limit || '10' }}
      STREAM_MAX_POINTS: "1200"
      UPLOAD_FIT_FILES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore Garmin tokens
        run: |
          rm -rf garmin_tokens garmin_tokens.tar.gz
          printf '%s' "$GARMIN_TOKENS_TGZ_BASE64" | tr -d '\r\n ' | base64 -d > garmin_tokens.tar.gz
          tar -xzf garmin_tokens.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python enrich_activities.py
