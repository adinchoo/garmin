<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | Fitness AI Hub</title>

  <link rel="stylesheet" href="./assets/css/app.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/supabase.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/dashboard.js"></script>
  <script src="https://js.puter.com/v2/"></script>
</head>

<body>
  <div class="container">

    <div class="header">
      <div>
        <h1>Fitness AI Hub</h1>
        <p id="userEmail" class="subtitle"></p>
      </div>

      <button onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="card stat">
        <h3>Current Weight</h3>
        <p id="weight">-</p>
      </div>

      <div class="card stat">
        <h3>Target Weight</h3>
        <p id="targetWeight">-</p>
      </div>

      <div class="card stat">
        <h3>Today's Steps</h3>
        <p id="steps">-</p>
      </div>

      <div class="card stat">
        <h3>Resting HR</h3>
        <p id="rhr">-</p>
      </div>

      <div class="card stat">
        <h3>Stress</h3>
        <p id="stress">-</p>
      </div>

      <div class="card stat">
        <h3>AI Readiness</h3>
        <p id="readiness">-</p>
      </div>
    </div>

    <div class="card">
      <h2>AI Body Condition Report</h2>

      <button onclick="generateAiReport()">Generate AI Analysis</button>

      <div id="aiReport" class="report">
        No AI report yet.
      </div>
    </div>

    <div class="card">
      <h2>Manual Body Measurement</h2>

      <input id="manualWeight" type="number" step="0.1" placeholder="Weight kg" />
      <input id="manualBodyFat" type="number" step="0.1" placeholder="Body fat %" />

      <button onclick="saveBodyMeasurement()">Save Measurement</button>

      <p id="measurementMessage"></p>
    </div>

    <div class="card">
      <h2>Recent Activities</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Distance</th>
              <th>Duration</th>
              <th>Calories</th>
              <th>Avg HR</th>
            </tr>
          </thead>

          <tbody id="activitiesTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Latest Daily Health</h2>
      <div id="dailyHealthList"></div>
    </div>

  </div>
</body>
</html>
