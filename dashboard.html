  /* === FULL-SCREEN FIX - IDENTICAL TO index.html === */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    background: #08111f;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  body {
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    margin: 0;
    padding: 0;
    background: #08111f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', Inter, sans-serif;
    overflow: hidden;
  }

  .app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    background: #08111f;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }

  .main {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  .header {
    width: 100%;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top) / 2);
    background: #08111f;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(8,17,31,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
  }

  /* Desktop preservation - unchanged behavior */
  @media (min-width: 768px) {
    .app { position: relative; max-width: 480px; margin: 0 auto; border-left: 1px solid rgba(255,255,255,0.06); border-right: 1px solid rgba(255,255,255,0.06); }
    .bottom-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
  }

  .card { background: #12223f; border-radius: 16px; padding: 20px; margin-bottom: 12px; }
  .metric { font-size: 28px; font-weight: 700; }
</style>
