<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness AI">
<meta name="format-detection" content="telephone=no">
<meta name="screen-orientation" content="any">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="./assets/css/app.css">
<title>Fitness AI Hub</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="./assets/js/config.js"></script>
<script defer src="./assets/js/pwa.js"></script>
<script defer src="./assets/js/supabase.js"></script>
<script defer src="./assets/js/auth.js"></script>
<script defer src="./assets/js/app.js"></script>
</head><body class="auth-page">
<main class="auth-wrap">
<section class="auth-art"><img src="./assets/icons/icon-120.png" width="72" height="72" alt="Fitness AI"><div><p class="overline">FITNESS INTELLIGENCE</p><h1>Every signal.<br>One clear plan.</h1><p>Garmin health, activity insights, nutrition tracking and AI coaching in one private dashboard. Now in true fullscreen PWA.</p></div></section>
<section class="auth-side"><div class="auth-card"><div class="mobile-logo"><img src="./assets/icons/icon-72.png" width="48" height="48" alt=""><b>Fitness AI</b></div><div class="tabs"><button class="tab active" data-panel="loginPanel">Sign in</button><button class="tab" data-panel="signupPanel">Create account</button></div><form id="loginPanel" class="auth-form active"><h2>Welcome back</h2><label>Email<input id="loginEmail" type="email" autocomplete="email" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="btn primary">Sign in</button></form><form id="signupPanel" class="auth-form"><h2>Create account</h2><label>Full name<input id="fullName" autocomplete="name" required></label><label>Email<input id="signupEmail" type="email" autocomplete="email" required></label><label>Password<input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required></label><button class="btn primary">Create account</button></form><div id="authMessage" class="message" aria-live="polite"></div></div></section>
</main>
<button id="fsFab" class="fs-fab" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button>
</body></html>
