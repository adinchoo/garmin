<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIX: viewport-fit=cover + no zoom lock = auto resize -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no" />
    
    <meta name="theme-color" content="#08131f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Garmin health and performance dashboard rebuilt for mobile and desktop." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

    <!-- iOS Fullscreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness AI" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Garmin — Performance OS</title>

    <!-- CRITICAL: Fixes square / 100vh bug in PWA -->
    <style>
      * { box-sizing: border-box; }
      html {
        width: 100%;
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        overflow: hidden;
      }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        background: #08131f;
        /* Safe areas for notch + home bar */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        aspect-ratio: auto !important;
      }
      /* Kill any fixed square in your React components */
      #root > * {
        max-width: 100vw !important;
        aspect-ratio: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Force correct height on iOS PWA rotate
      function fixHeight() {
        const vh = window.innerHeight;
        document.documentElement.style.setProperty('--vh', `${vh * 0.01}px`);
        document.getElementById('root').style.height = vh + 'px';
      }
      window.addEventListener('resize', fixHeight);
      window.addEventListener('orientationchange', () => setTimeout(fixHeight, 200));
      fixHeight();

      // Register SW if you have one
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(()=>{});
        });
      }
    </script>
  </body>
</html>
