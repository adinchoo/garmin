<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness AI Hub</title>

    assets/css/app.css
    <link rel="manifest" href="manifest.json">

    <script/cdn.jsdelivr.net/npm/@supabase/supabase-js@2script>

    assets/js/config.jsscript>
    assets/js/supabase.jsscript>
    assets/js/auth.jsscript>
</head>

<body>

<div class="container">

    <h1>Fitness AI Hub</h1>

    <div class="card">

        <h2>Create Account</h2>

        <input
            id="fullName"
            placeholder="Full Name">

        <input
            id="signupEmail"
            type="email"
            placeholder="Email">

        <input
            id="signupPassword"
            type="password"
            placeholder="Password">

        <button onclick="signUp()">
            Create Account
        </button>

    </div>

    <div class="card">

        <h2>Login</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email">

        <input
            id="loginPassword"
            type="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

    </div>

</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
