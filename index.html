<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- FIXED VIEWPORT META: added spaces, user-scalable=no, viewport-fit=cover preserved -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- ADDED FOR iOS PWA FULLSCREEN -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness AI">
<meta name="theme-color" content="#08111f">
<title>Fitness AI - Home</title>
<style>
  /* === FULL-SCREEN FIX START === */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html {
    width: 100%;
    height: 100%;
    min-height: 100%;
    min-height: 100dvh; /* dynamic viewport height for iPhone */
    background: #08111f;
    /* Prevent bounce + ensure cover */
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  
  body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    margin: 0;
    padding: 0;
    background: #08111f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', Inter, sans-serif;
    overflow: hidden; /* app handles internal scroll */
    /* Safe area handled at app level, body just ensures bg fills */
  }

  /* Main app container - THE CORE FIX for centered box issue */
  .app {
    position: fixed;
    inset: 0; /* top:0 right:0 bottom:0 left:0 - forces edge-to-edge */
    width: 100%;
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    background: #08111f;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Respect notch / Dynamic Island / home indicator */
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }

  /* Scrollable content area */
  .main {
    flex: 1;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    /* bottom nav height + safe area */
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }

  /* Header - stays inside safe area */
  .header {
    width: 100%;
    padding: 12px 16px;
    background: #08111f;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  /* Bottom navigation - fixed, respects home indicator */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(8,17,31,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
  }
  /* === FULL-SCREEN FIX END === */

  /* Preserved branding */
  .card { background: #12223f; border-radius: 16px; padding: 20px; margin-bottom: 12px; }
  .btn { background: #2a5bd7; color: white; border-radius: 12px; padding: 12px 20px; border: 0; width: 100%; }
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <h1>Fitness AI</h1>
    </div>
    <div class="main" id="main">
      <div class="card">
        <h2>Welcome</h2>
        <p>Your Garmin-synced AI fitness dashboard.</p>
      </div>
      <div class="card">
        <button class="btn" onclick="location.href='dashboard.html'">Go to Dashboard</button>
      </div>
    </div>
    <nav class="bottom-nav">
      <span>Home</span>
      <span>Stats</span>
      <span>AI Coach</span>
      <span>Profile</span>
    </nav>
  </div>
  <script>
    // Existing app logic preserved - no changes
    console.log('Fitness AI index loaded');
  </script>
</body>
</html>
